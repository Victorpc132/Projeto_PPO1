<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matchmaking Cadastro</title>
    <link rel="stylesheet" href="Pages.css">
</head>
<body>

    <aside id="topo">
        <h1>Matchmaking Cadastro</h1>
    </aside>

    <div class="login-link">
        <p>Já tem uma conta? <a href="login.html">Faça login</a></p>
    </div>

    <main>
        <h2>Cadastro</h2>
        <form method="POST" class="cadastro-form">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Digite seu email" required>

            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>

            <button type="submit">Criar a minha conta</button>
        </form>
    </main>
    <script>
        const formulario = document.querySelector('.cadastro-form');


        formulario.addEventListener("submit", async (event) => {
            event.preventDefault();


            const nome = document.querySelector("#nome").value;
            const email = document.querySelector("#email").value;
            const senha = document.querySelector("#senha").value;

            const resposta = await fetch("http://localhost:300/usuarios", {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body:JSON.stringify({
                    nome: nome,
                    email: email,
                    senha: senha
                })
                });
            const dados = await resposta.json();

            alert(dados.mensagem);
        });
    </script>
</body>
</html>
