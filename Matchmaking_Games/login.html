<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar | Duo</title>
  <link rel="stylesheet" href="Pages.css">
</head>

<body>
  <main class="auth-shell">
    <section class="auth-intro"><a class="brand" href="/main">DUO<span>/</span>PLAY</a>
      <p class="eyebrow">Bom te ver de volta</p>
      <h1>Seu time está esperando.</h1>
      <p>Retome suas conexões, ajuste suas preferências e descubra quem combina com sua próxima partida.</p>
    </section>
    <section class="auth-card">
      <p class="eyebrow">Acesso</p>
      <h2>Entrar na conta</h2>
      <p>Use os dados que você cadastrou para continuar.</p>
      <form class="auth-form" id="login-form">
        <label for="email">E-mail</label>
        <input id="email" type="email" placeholder="voce@email.com" autocomplete="email" required>
        <label for="password">Senha</label>
        <div class="password-field">
          <input id="password" type="password" placeholder="Sua senha" autocomplete="current-password" required>
          <button type="button" class="view-toggle" id="password-toggle" aria-label="Mostrar senha">👁️</button>
        </div>
        <p class="message" id="form-message" role="status"></p>
        <button class="button-primary" type="submit">Entrar no Duo <span aria-hidden="true">→</span></button>
      </form>
      <p class="auth-switch">Ainda não tem conta? <a href="/cadastro">Criar meu perfil</a></p><a class="back-link"
        href="/main">← Voltar para início</a>
    </section>
  </main>
  <script>
    const loggedUser = JSON.parse(localStorage.getItem('duoplayUser') || 'null');
    if (loggedUser?.id) {
      window.location.replace('/main');
    }

    const passwordField = document.querySelector('#password');
    const passwordToggle = document.querySelector('#password-toggle');

    passwordToggle.addEventListener('click', () => {
      const isPassword = passwordField.type === 'password';
      passwordField.type = isPassword ? 'text' : 'password';
      passwordToggle.textContent = isPassword ? '🙈' : '👁️';
      passwordToggle.setAttribute('aria-label', isPassword ? 'Ocultar senha' : 'Mostrar senha');
    });

    document.querySelector('#login-form').addEventListener('submit', async (event) => {
      event.preventDefault();

      const email = document.querySelector('#email').value.trim();
      const password = document.querySelector('#password').value;
      const message = document.querySelector('#form-message');

      message.textContent = 'Entrando...';

      const response = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });

      const result = await response.json();
      message.textContent = result.message || 'Erro ao entrar.';

      if (response.ok) {
        localStorage.setItem('duoplayLoggedIn', 'true');
        localStorage.setItem('duoplayUser', JSON.stringify(result.user));
        const redirect = new URLSearchParams(window.location.search).get('redirect') || '/main';
        window.location.href = redirect;
      }
    });
  </script>
</body>
</html>
